[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microrca"
version = "0.2.0"
description = "Agentic root cause analysis for microservice systems (AI4015 semester project, G2-07, Phase 2)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pydantic>=2.5", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
microrca-eval = "microrca.eval.run:main"
microrca-failures = "microrca.eval.failures:main"
microrca-gap-table = "microrca.eval.gap_table:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
