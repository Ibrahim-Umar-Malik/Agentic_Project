<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .box{fill:#fff;stroke:#444;stroke-width:1.5;rx:8}
      .t{font-size:15px;fill:#111}
      .h{font-size:16px;font-weight:bold;fill:#111}
      .s{font-size:13px;fill:#333}
      .ln{stroke:#444;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke:#888;stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .gap{font-size:13px;font-weight:bold;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="960" fill="#fff"/>
  <text x="700" y="34" text-anchor="middle" style="font-size:22px;font-weight:bold">MicroRCA-Agent: proposed architecture, gap placement and baselines</text>

  <!-- data sources -->
  <rect x="30" y="70" width="250" height="300" fill="#eef4fb" stroke="#4a78b0" stroke-width="1.5" rx="10"/>
  <text x="155" y="96" text-anchor="middle" class="h">Environment / data</text>
  <rect x="50" y="110" width="210" height="44" class="box"/><text x="155" y="137" text-anchor="middle" class="t">Metrics (CPU, mem, lat.)</text>
  <rect x="50" y="162" width="210" height="44" class="box"/><text x="155" y="189" text-anchor="middle" class="t">Logs (+ fault-free logs)</text>
  <rect x="50" y="214" width="210" height="44" class="box"/><text x="155" y="241" text-anchor="middle" class="t">Traces (spans)</text>
  <rect x="50" y="266" width="210" height="44" class="box"/><text x="155" y="293" text-anchor="middle" class="t">Service call graph</text>
  <text x="155" y="334" text-anchor="middle" class="s">Nezha OB + TT: 101 cases (dev)</text>
  <text x="155" y="354" text-anchor="middle" class="s">OpenRCA Telecom: 51 cases (base)</text>

  <rect x="30" y="400" width="250" height="90" class="box"/>
  <text x="155" y="428" text-anchor="middle" class="h">Data pipeline</text>
  <text x="155" y="450" text-anchor="middle" class="s">preprocess → IncidentCase bundle</text>
  <text x="155" y="470" text-anchor="middle" class="s">label hidden via blind()</text>
  <path d="M155 370 L155 398" class="ln"/>

  <!-- tool layer -->
  <rect x="330" y="400" width="300" height="190" fill="#f3f8ef" stroke="#5b8f3a" stroke-width="1.5" rx="10"/>
  <text x="480" y="426" text-anchor="middle" class="h">Tool layer (JSON-schema tools)</text>
  <text x="350" y="452" class="s">list_services · get_call_graph</text>
  <text x="350" y="474" class="s">detect_metric_anomalies</text>
  <text x="350" y="496" class="s">get_metric_summary</text>
  <text x="350" y="518" class="s">get_log_summary · get_trace_summary</text>
  <text x="350" y="546" class="s">Phase 2: check_propagation_path,</text>
  <text x="350" y="566" class="s">compare_to_past_incident</text>
  <path d="M280 445 L328 445" class="ln"/>

  <!-- agent core -->
  <rect x="330" y="70" width="700" height="300" fill="#fbf4ea" stroke="#b07a2a" stroke-width="1.5" rx="10"/>
  <text x="680" y="96" text-anchor="middle" class="h">Agentic RCA core (proposed system)</text>
  <rect x="350" y="112" width="220" height="110" class="box"/>
  <text x="460" y="138" text-anchor="middle" class="h">Investigator agent</text>
  <text x="460" y="160" text-anchor="middle" class="s">LLM, ReAct loop:</text>
  <text x="460" y="180" text-anchor="middle" class="s">think → call tool → observe</text>
  <text x="460" y="200" text-anchor="middle" class="s">→ ranked hypotheses</text>

  <rect x="350" y="240" width="220" height="110" class="box"/>
  <text x="460" y="266" text-anchor="middle" class="h">AgentState</text>
  <text x="460" y="288" text-anchor="middle" class="s">messages, observations,</text>
  <text x="460" y="308" text-anchor="middle" class="s">hypotheses, step counter,</text>
  <text x="460" y="328" text-anchor="middle" class="s">Usage (tokens, calls, latency)</text>
  <path d="M460 222 L460 238" class="ln"/>

  <rect x="600" y="112" width="200" height="110" class="box"/>
  <text x="700" y="138" text-anchor="middle" class="h">Budget controller</text>
  <text x="700" y="160" text-anchor="middle" class="s">anomaly-guided tool</text>
  <text x="700" y="180" text-anchor="middle" class="s">choice, step/token caps,</text>
  <text x="700" y="200" text-anchor="middle" class="s">early stop on confidence</text>
  <rect x="612" y="96" width="62" height="22" rx="11" fill="#c0392b"/><text x="643" y="112" text-anchor="middle" class="gap">Gap 2</text>
  <path d="M598 160 L572 160" class="ln"/>

  <rect x="600" y="240" width="200" height="110" class="box"/>
  <text x="700" y="266" text-anchor="middle" class="h">Verifier agent</text>
  <text x="700" y="288" text-anchor="middle" class="s">checks top hypothesis</text>
  <text x="700" y="308" text-anchor="middle" class="s">against evidence and</text>
  <text x="700" y="328" text-anchor="middle" class="s">propagation direction</text>
  <rect x="612" y="224" width="62" height="22" rx="11" fill="#8e44ad"/><text x="643" y="240" text-anchor="middle" class="gap">Gap 1</text>
  <path d="M572 200 Q 590 260 598 280" class="ln"/>
  <path d="M598 330 Q 585 335 572 335" class="dash"/>
  <text x="625" y="364" class="s" fill="#666">reject → re-investigate</text>

  <rect x="830" y="112" width="180" height="238" class="box"/>
  <text x="920" y="138" text-anchor="middle" class="h">Incident memory</text>
  <text x="920" y="162" text-anchor="middle" class="s">store: anomaly</text>
  <text x="920" y="182" text-anchor="middle" class="s">signature + verified</text>
  <text x="920" y="202" text-anchor="middle" class="s">diagnosis</text>
  <text x="920" y="232" text-anchor="middle" class="s">recall: top-k similar</text>
  <text x="920" y="252" text-anchor="middle" class="s">past incidents as</text>
  <text x="920" y="272" text-anchor="middle" class="s">context (no hand-</text>
  <text x="920" y="292" text-anchor="middle" class="s">written SOPs)</text>
  <rect x="842" y="96" width="62" height="22" rx="11" fill="#16a085"/><text x="873" y="112" text-anchor="middle" class="gap">Gap 3</text>
  <path d="M828 140 L802 140" class="dash"/>

  <!-- agent ↔ tools -->
  <path d="M440 352 L440 398" class="ln"/>
  <path d="M520 398 L520 352" class="ln"/>
  <text x="380" y="392" class="s">calls</text><text x="528" y="392" class="s">results</text>

  <!-- LLM providers -->
  <rect x="1080" y="70" width="290" height="120" class="box"/>
  <text x="1225" y="96" text-anchor="middle" class="h">LLM provider layer</text>
  <text x="1225" y="120" text-anchor="middle" class="s">OpenAI · Anthropic · Gemini</text>
  <text x="1225" y="140" text-anchor="middle" class="s">OpenAI-compatible (Ollama, Groq)</text>
  <text x="1225" y="160" text-anchor="middle" class="s">scripted (offline CI only)</text>
  <path d="M1078 130 L1032 130" class="ln"/>

  <!-- output -->
  <rect x="1080" y="230" width="290" height="120" class="box"/>
  <text x="1225" y="256" text-anchor="middle" class="h">Diagnosis (contract)</text>
  <text x="1225" y="280" text-anchor="middle" class="s">ranked services + fault type,</text>
  <text x="1225" y="300" text-anchor="middle" class="s">confidence, evidence, summary</text>
  <path d="M1032 290 L1078 290" class="ln"/>

  <rect x="1080" y="400" width="290" height="100" class="box"/>
  <text x="1225" y="426" text-anchor="middle" class="h">Human control (SRE)</text>
  <text x="1225" y="450" text-anchor="middle" class="s">reviews diagnosis; confirmed</text>
  <text x="1225" y="470" text-anchor="middle" class="s">cases written to memory</text>
  <path d="M1225 352 L1225 398" class="ln"/>
  <path d="M1078 470 Q 1040 470 1010 352" class="dash"/>

  <rect x="1080" y="540" width="290" height="110" class="box"/>
  <text x="1225" y="566" text-anchor="middle" class="h">Evaluation harness</text>
  <text x="1225" y="590" text-anchor="middle" class="s">AC@1/3/5, Avg@5, fault-type acc,</text>
  <text x="1225" y="610" text-anchor="middle" class="s">wrong-cause rate, tokens,</text>
  <text x="1225" y="630" text-anchor="middle" class="s">tool calls, latency, $ per case</text>
  <path d="M1370 300 Q 1395 420 1372 595" class="ln"/>

  <!-- baselines band -->
  <rect x="30" y="690" width="1340" height="240" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="10"/>
  <text x="700" y="716" text-anchor="middle" class="h">Baselines (same data, same tools, same Diagnosis contract, same harness)</text>
  <rect x="50" y="734" width="310" height="176" class="box"/>
  <text x="205" y="760" text-anchor="middle" class="h">B0 statistical (no LLM)</text>
  <text x="205" y="784" text-anchor="middle" class="s">robust z-score per metric;</text>
  <text x="205" y="804" text-anchor="middle" class="s">multimodal reciprocal-rank fusion</text>
  <text x="205" y="824" text-anchor="middle" class="s">of CPU, memory, latency, trace, log</text>
  <text x="205" y="854" text-anchor="middle" class="s">no tools chosen, no loop</text>
  <text x="205" y="884" text-anchor="middle" class="s" font-weight="bold">implemented, results in repo</text>

  <rect x="380" y="734" width="310" height="176" class="box"/>
  <text x="535" y="760" text-anchor="middle" class="h">B1 single LLM call</text>
  <text x="535" y="784" text-anchor="middle" class="s">all tool outputs pre-computed</text>
  <text x="535" y="804" text-anchor="middle" class="s">into one prompt, one answer</text>
  <text x="535" y="854" text-anchor="middle" class="s">no tool choice, no iteration,</text>
  <text x="535" y="874" text-anchor="middle" class="s">no verifier, no memory</text>
  <text x="535" y="898" text-anchor="middle" class="s" font-weight="bold">implemented, runs with API key</text>

  <rect x="710" y="734" width="310" height="176" class="box"/>
  <text x="865" y="760" text-anchor="middle" class="h">B2 plain ReAct agent (P0)</text>
  <text x="865" y="784" text-anchor="middle" class="s">same loop and tools, but</text>
  <text x="865" y="804" text-anchor="middle" class="s">verifier, budget controller</text>
  <text x="865" y="824" text-anchor="middle" class="s">and memory switched off</text>
  <text x="865" y="854" text-anchor="middle" class="s">= ablation reference for</text>
  <text x="865" y="874" text-anchor="middle" class="s">each gap</text>
  <text x="865" y="898" text-anchor="middle" class="s" font-weight="bold">implemented, runs with API key</text>

  <rect x="1040" y="734" width="310" height="176" class="box"/>
  <text x="1195" y="760" text-anchor="middle" class="h">B3 base paper: OpenRCA</text>
  <text x="1195" y="784" text-anchor="middle" class="s">RCA-agent (Controller +</text>
  <text x="1195" y="804" text-anchor="middle" class="s">code Executor), published</text>
  <text x="1195" y="824" text-anchor="middle" class="s">numbers + re-run on the</text>
  <text x="1195" y="844" text-anchor="middle" class="s">OpenRCA Telecom subset</text>
  <text x="1195" y="898" text-anchor="middle" class="s" font-weight="bold">Phase 2</text>
</svg>
